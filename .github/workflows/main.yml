name: generate animation

on:
  schedule:
    # Executa a cada 24 horas às 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gui23x
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a855f7&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a855f7
            dist/github-contribution-grid-snake-dark.svg?color_snake=#a855f7&color_dots=#0d1117,#2e1065,#5b21b6,#7c3aed,#a855f7

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
