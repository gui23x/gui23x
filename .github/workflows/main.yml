name: generate animation

on:
  schedule:
    # Executa a cada 24 horas às 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gui23x
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8c8c8c&color_dots=#161b22,#34373d,#515457,#6f7072,#8c8c8c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8c8c8c&color_dots=#161b22,#34373d,#515457,#6f7072,#8c8c8c

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
