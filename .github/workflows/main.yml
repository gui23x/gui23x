name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gui23x
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#57606a&color_dots=#ebedf0,#d0d7de,#afb8c1,#8c959f,#57606a
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8b949e&color_dots=#161b22,#21262d,#30363d,#484f58,#8b949e

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
